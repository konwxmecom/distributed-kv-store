syntax = "proto3";

package kvstore;

// KVStore defines a distributed key-value store service backed by Raft consensus.
service KVStore {
    // Client-facing operations
    rpc Get (GetRequest) returns (GetResponse);
    rpc Set (SetRequest) returns (SetResponse);
    rpc Delete (DeleteRequest) returns (DeleteResponse);
    rpc ListKeys (ListKeysRequest) returns (ListKeysResponse);
    rpc GetClusterStatus (ClusterStatusRequest) returns (ClusterStatusResponse);

    // Legacy leader-to-follower replication call (superseded by AppendEntries)
    rpc Replicate (SetRequest) returns (SetResponse);

    // Cluster membership / liveness
    rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);

    // Raft consensus RPCs
    rpc RequestVote (VoteRequest) returns (VoteResponse);
    rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
    rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// --- Basic key-value operations ---

enum ReadConsistency {
    STRONG = 0;
    EVENTUAL = 1;
}

message GetRequest {
    string key = 1;
    ReadConsistency consistency = 2;
}

message GetResponse {
    string value = 1;
    bool found = 2;
    int32 leader_id = 3;
}

message SetRequest {
    string key = 1;
    string value = 2;
    string request_id = 3;
    string client_id = 4;
    uint64 request_sequence = 5;
}

message SetResponse {
    bool success = 1;
    int32 leader_id = 2;
    string request_id = 3;
    string client_id = 4;
    uint64 request_sequence = 5;
}

message DeleteRequest {
    string key = 1;
    string request_id = 2;
    string client_id = 3;
    uint64 request_sequence = 4;
}

message DeleteResponse {
    bool success = 1;
    int32 leader_id = 2;
    string request_id = 3;
    string client_id = 4;
    uint64 request_sequence = 5;
}

message ListKeysRequest {
    ReadConsistency consistency = 1;
}

message ListKeysResponse {
    repeated string keys = 1;
    int32 leader_id = 2;
}

message ClusterStatusRequest {}

message ClusterStatusResponse {
    int32 node_id = 1;
    int32 leader_id = 2;
    int32 current_term = 3;
    int32 commit_index = 4;
    bool is_leader = 5;
}

// --- Heartbeat / liveness ---

message HeartbeatRequest {
    int32 leader_port = 1;  // identifies which leader sent this heartbeat (for logging)
    int32 leader_term = 2;
}

message HeartbeatResponse {
    bool alive = 1;
    int32 term = 2;
}

// --- Leader election ---

message VoteRequest {
    int32 candidate_term = 1;  // the term the candidate is running for
    int32 candidate_id = 2;    // candidate's unique identifier (its port number)
    int32 candidate_last_log_index = 3;
    int32 candidate_last_log_term = 4;
    bool pre_vote = 5;         // pre-votes do not change persistent term/vote state
}

message VoteResponse {
    bool vote_granted = 1;  // whether the vote was granted
    int32 voter_term = 2;   // voter's current term, so the candidate can stay up to date
}

// --- Log replication ---

message LogEntry {
    int32 term = 1;  // term in which this entry was created
    string key = 2;
    string value = 3;
    bool no_op = 4;  // leader-establishment entry; advances commit without changing KV data
    string request_id = 5; // durable client retry deduplication key
    uint64 log_index_plus_one = 6; // absolute index + 1; zero identifies legacy WAL records
    string client_id = 7;
    uint64 request_sequence = 8;
}

message AppendEntriesRequest {
    int32 leader_term = 1;
    int32 leader_id = 2;
    int32 prev_log_index = 3;       // index of the log entry immediately preceding the new ones
    int32 prev_log_term = 4;        // term of that preceding entry
    repeated LogEntry entries = 5;  // log entries to append (empty for a heartbeat-style call)
    int32 leader_commit = 6;        // leader's commit index, so followers know which entries are safe to apply
}

message AppendEntriesResponse {
    int32 term = 1;
    bool success = 2;      // false if the follower's log didn't match the leader's expectations
    int32 match_index = 3; // how far the follower's log now matches the leader's
}

message InstallSnapshotRequest {
    int32 leader_term = 1;
    int32 leader_id = 2;
    int32 last_included_index = 3;
    int32 last_included_term = 4;
    bytes snapshot_data = 5;
    bool done = 6;
}

message InstallSnapshotResponse {
    int32 term = 1;
    bool success = 2;
    int32 match_index = 3;
}

message SnapshotKVPair {
    string key = 1;
    string value = 2;
}

message SnapshotRequestResult {
    string request_id = 1;
    bool success = 2;
    int32 leader_id = 3;
    string client_id = 4;
    uint64 request_sequence = 5;
}

message SnapshotData {
    repeated SnapshotKVPair entries = 1;
    repeated SnapshotRequestResult completed_requests = 2;
    map<string, uint64> client_sequences = 3;
}